[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.2", "uvicorn==0.31.1", "pydantic==2.12.5", "sqlmodel==0.0.22", "PyYAML==6.0.2", "python-multipart==0.0.20", "anthropic==0.49.0", "python-dotenv==1.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "hypothesis==6.131.9", "httpx==0.27.2", "ruff==0.11.5", "mypy==1.15.0", "types-PyYAML==6.0.12.20250402", "pre-commit==4.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=finagent.domain --cov=finagent.agents --cov=finagent.analysis --cov=finagent.rules --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
